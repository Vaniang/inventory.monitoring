<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - IMS</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap');
        :root { --primary: #2c3e50; --accent: #3498db; --bg: #f0f2f5; --green: #27ae60; --red: #e74c3c; --orange: #f39c12; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: var(--bg); color: #333; }
        .view-container { display: flex; height: 100vh; overflow: hidden; }
        .hidden { display: none !important; }

        /* SIDEBAR */
        .sidebar { width: 260px; background: #1a252f; color: white; display: flex; flex-direction: column; padding: 20px; box-shadow: 2px 0 10px rgba(0,0,0,0.1); z-index: 10; }
        .sidebar h2 { text-align: center; font-size: 1.5rem; margin-bottom: 40px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 20px; }
        .nav-link { padding: 15px 20px; margin-bottom: 10px; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; font-weight: 500; display: flex; align-items: center; }
        .nav-link:hover { background: rgba(255,255,255,0.1); transform: translateX(5px); }
        .nav-link.active { background: var(--accent); border-left: 4px solid white; }
        .logout-btn { margin-top: auto; background: var(--red); text-align: center; justify-content: center; }

        /* MAIN */
        .main { flex: 1; padding: 40px; overflow-y: auto; }
        .header-title h1 { color: var(--primary); font-size: 2rem; margin: 0 0 30px 0; }

        /* CARDS */
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 30px; margin-bottom: 40px; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); text-align: center; border-left: 5px solid var(--primary); }
        .card h3 { margin: 0; color: #7f8c8d; font-size: 0.9rem; text-transform: uppercase; }
        .card .number { font-size: 2.5rem; font-weight: 800; color: #333; margin-top: 10px; }

        /* TABLES */
        .content-box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .data-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .data-table th { background: #eee; padding: 15px; text-align: left; color: #555; font-weight: 700; }
        .data-table td { padding: 15px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
        
        /* BADGES & BUTTONS */
        .badge { padding: 5px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; display: inline-block; }
        .badge-Pending { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .badge-Approved { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .badge-Rejected { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        .action-btn { border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-weight: bold; color: white; margin-right: 5px; transition: transform 0.2s; display: inline-flex; align-items: center; justify-content: center; }
        .action-btn:hover { transform: scale(1.1); }
        .btn-approve { background: var(--green); }
        .btn-reject { background: var(--red); }
    </style>
</head>
<body>

    <div class="view-container">
        <div class="sidebar">
            <h2>Admin Panel</h2>
            <div class="nav-link active">Dashboard</div>
            <div class="nav-link" onclick="logout()" style="margin-top:auto; background:#c0392b; text-align:center;">Logout</div>
        </div>

        <div class="main">
            <div class="header-title">
                <h1>Admin Dashboard</h1>
            </div>

            <div class="cards-grid">
                <div class="card" style="border-color: #2c3e50;">
                    <h3>Total Requests</h3>
                    <div class="number" id="adm-total">0</div>
                </div>
                <div class="card" style="border-color: #f39c12;">
                    <h3>Pending</h3>
                    <div class="number" id="adm-pending" style="color:#f39c12">0</div>
                </div>
                <div class="card" style="border-color: #27ae60;">
                    <h3>Approved</h3>
                    <div class="number" id="adm-approved" style="color:#27ae60">0</div>
                </div>
            </div>

            <div class="content-box">
                <h3>🔔 Incoming Requests</h3>
                <p style="color:#777; font-size:0.9rem;">Approve or reject requests below. Users will be notified instantly.</p>
                
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Division</th>
                            <th>Items Requested</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="requestTable">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 1. CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyDxPnmXxfno19bkj9VHP1Do97PDg0lp04s",
            authDomain: "supplies-monitoring.firebaseapp.com",
            projectId: "supplies-monitoring",
            storageBucket: "supplies-monitoring.firebasestorage.app",
            messagingSenderId: "524755577094",
            appId: "1:524755577094:web:cd3c45819698c3380a1687",
            measurementId: "G-033SS1BHK1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // 2. AUTH CHECK
        auth.onAuthStateChanged(user => {
            if (!user) {
                window.location.href = "../index.html";
            } else {
                // Optional: Check if role is really admin
                db.collection('users').doc(user.uid).get().then(doc => {
                    if (doc.exists && doc.data().role === 'admin') {
                        initAdminDashboard();
                    } else {
                        // Redirect non-admins back to user page
                        window.location.href = "../user/user.html";
                    }
                });
            }
        });

        function logout() {
            auth.signOut().then(() => window.location.href = "../index.html");
        }

        // 3. DASHBOARD LOGIC
        function initAdminDashboard() {
            // Listen to all requisitions
            db.collection('requisitions').orderBy('date', 'desc').onSnapshot(snap => {
                let total = 0, pending = 0, approved = 0;
                let html = '';
                
                snap.forEach(doc => {
                    const r = doc.data();
                    total++;
                    if(r.status === 'Approved') approved++;
                    if(r.status === 'Pending' || !r.status) pending++;

                    // Only show Pending items in the table for action (Optional: remove if if you want to see history)
                    // Let's show everything but sort by date so pending is top
                    
                    const itemsStr = r.items.map(i => `${i.itemName} (${i.reqQty})`).join(', ');
                    const dateStr = new Date(r.date).toLocaleDateString();
                    const status = r.status || 'Pending';
                    
                    // Buttons only appear if status is Pending
                    let actions = '';
                    if(status === 'Pending') {
                        actions = `
                            <button class="action-btn btn-approve" title="Approve" onclick="setStatus('${doc.id}', 'Approved', '${r.userId}')">✓</button>
                            <button class="action-btn btn-reject" title="Reject" onclick="setStatus('${doc.id}', 'Rejected', '${r.userId}')">✗</button>
                        `;
                    } else {
                        actions = '<span style="color:#aaa;">—</span>';
                    }

                    html += `
                        <tr>
                            <td>${dateStr}</td>
                            <td><strong style="color:#2c3e50;">${r.division}</strong></td>
                            <td style="font-size:0.9em; color:#555;">${itemsStr}</td>
                            <td><span class="badge badge-${status}">${status}</span></td>
                            <td>${actions}</td>
                        </tr>
                    `;
                });

                // Update Stats
                document.getElementById('adm-total').innerText = total;
                document.getElementById('adm-pending').innerText = pending;
                document.getElementById('adm-approved').innerText = approved;
                
                // Update Table
                document.getElementById('requestTable').innerHTML = html;
            });
        }

        // 4. APPROVE/REJECT & NOTIFY
        function setStatus(docId, status, userId) {
            if(!confirm(`Are you sure you want to mark this request as ${status}?`)) return;
            
            const batch = db.batch();
            
            // A. Update the Requisition Status
            const reqRef = db.collection('requisitions').doc(docId);
            batch.update(reqRef, { status: status });

            // B. Send Notification to the specific User
            if(userId) {
                const notifRef = db.collection('notifications').doc();
                batch.set(notifRef, {
                    userId: userId, // Target the specific user
                    title: `Request ${status}`,
                    message: status === 'Approved' 
                        ? "Good news! Your supplies request has been approved. You may collect them at the supply office." 
                        : "Your supplies request has been rejected. Please contact the supply officer for details.",
                    status: 'unread',
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
            }

            batch.commit()
                .then(() => alert(`Request ${status} and User Notified!`))
                .catch(err => alert("Error: " + err.message));
        }
    </script>
</body>
</html>
