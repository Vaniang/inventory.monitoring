<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - IMS</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap');
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: #f0f2f5; color: #333; }
        .view-container { display: flex; height: 100vh; }
        .sidebar { width: 260px; background: #2c3e50; color: white; padding: 20px; display: flex; flex-direction: column; }
        .sidebar h2 { text-align: center; margin-bottom: 40px; border-bottom: 1px solid #555; padding-bottom: 20px;}
        .nav-link { padding: 15px; margin-bottom: 5px; border-radius: 5px; cursor: pointer; transition: 0.2s; }
        .nav-link:hover, .nav-link.active { background: #34495e; border-left: 4px solid #3498db; }
        .main { flex: 1; padding: 40px; overflow-y: auto; }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-left: 5px solid #2c3e50; }
        .card .number { font-size: 2.5rem; font-weight: bold; margin-top: 5px; }
        .content-box { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .data-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .data-table th { background: #eee; padding: 12px; text-align: left; }
        .data-table td { padding: 12px; border-bottom: 1px solid #f0f0f0; }
        .badge { padding: 5px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; }
        .badge-Pending { background: #fff3cd; color: #856404; }
        .badge-Approved { background: #d4edda; color: #155724; }
        .badge-Rejected { background: #f8d7da; color: #721c24; }
        .action-btn { border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-weight: bold; color: white; margin-right: 5px; }
        .btn-approve { background: #2ecc71; }
        .btn-reject { background: #e74c3c; }
    </style>
</head>
<body>

    <div class="view-container">
        <div class="sidebar">
            <h2>Admin Panel</h2>
            <div class="nav-link active">Dashboard</div>
            <div class="nav-link" onclick="logout()" style="margin-top:auto; background:#c0392b; text-align:center;">Logout</div>
        </div>

        <div class="main">
            <h1>Admin Dashboard</h1>
            <div class="cards-grid">
                <div class="card"><h3>Total Requests</h3><div class="number" id="adm-total">0</div></div>
                <div class="card"><h3>Pending</h3><div class="number" id="adm-pending" style="color:#f39c12">0</div></div>
                <div class="card"><h3>Approved</h3><div class="number" id="adm-approved" style="color:#27ae60">0</div></div>
            </div>

            <div class="content-box">
                <h3>🔔 Incoming Requests</h3>
                <table class="data-table">
                    <thead><tr><th>Date</th><th>Division</th><th>Items</th><th>Status</th><th>Actions</th></tr></thead>
                    <tbody id="requestTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDxPnmXxfno19bkj9VHP1Do97PDg0lp04s",
            authDomain: "supplies-monitoring.firebaseapp.com",
            projectId: "supplies-monitoring",
            storageBucket: "supplies-monitoring.firebasestorage.app",
            messagingSenderId: "524755577094",
            appId: "1:524755577094:web:cd3c45819698c3380a1687",
            measurementId: "G-033SS1BHK1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        auth.onAuthStateChanged(user => {
            if (!user) window.location.href = "../index.html";
            else initAdminDashboard();
        });

        function logout() { auth.signOut().then(() => window.location.href = "../index.html"); }

        function initAdminDashboard() {
            db.collection('requisitions').orderBy('date', 'desc').onSnapshot(snap => {
                let total = 0, pending = 0, approved = 0;
                let html = '';
                
                snap.forEach(doc => {
                    const r = doc.data();
                    total++;
                    if(r.status === 'Approved') approved++;
                    if(r.status === 'Pending' || !r.status) {
                        pending++;
                        const itemsStr = r.items.map(i => `${i.itemName} (${i.reqQty})`).join(', ');
                        const dateStr = new Date(r.date).toLocaleDateString();
                        
                        html += `
                            <tr>
                                <td>${dateStr}</td>
                                <td><strong>${r.division}</strong></td>
                                <td style="font-size:0.9em; color:#555;">${itemsStr}</td>
                                <td><span class="badge badge-Pending">Pending</span></td>
                                <td>
                                    <button class="action-btn btn-approve" onclick="setStatus('${doc.id}', 'Approved', '${r.userId}')">✓</button>
                                    <button class="action-btn btn-reject" onclick="setStatus('${doc.id}', 'Rejected', '${r.userId}')">✗</button>
                                </td>
                            </tr>`;
                    }
                });

                document.getElementById('adm-total').innerText = total;
                document.getElementById('adm-pending').innerText = pending;
                document.getElementById('adm-approved').innerText = approved;
                document.getElementById('requestTable').innerHTML = html;
            });
        }

        // UPDATED STATUS FUNCTION: SENDS NOTIFICATION
        function setStatus(docId, status, userId) {
            if(!confirm(`Mark this request as ${status}?`)) return;
            
            const batch = db.batch();
            
            // 1. Update Request Status
            const reqRef = db.collection('requisitions').doc(docId);
            batch.update(reqRef, { status: status });

            // 2. Send Notification to User
            if(userId) {
                const notifRef = db.collection('notifications').doc();
                batch.set(notifRef, {
                    userId: userId,
                    title: `Request ${status}`,
                    message: status === 'Approved' 
                        ? "Your supplies request has been approved and is ready for collection." 
                        : "Your supplies request has been rejected.",
                    status: 'unread',
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
            }

            batch.commit().then(() => alert("Status Updated & Notification Sent!"));
        }
    </script>
</body>
</html>
